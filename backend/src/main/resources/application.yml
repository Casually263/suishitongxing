server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: suishi
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/suishi_dev?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:suishi}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      connection-init-sql: SET time_zone = '+00:00'
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    allowed-origins: ${AI_ALLOWED_ORIGINS:https://api.openai.com}
    allow-local-endpoints: ${AI_ALLOW_LOCAL_ENDPOINTS:false}
  security:
    jwt-key: ${JWT_SECRET_BASE64}
    email-key: ${EMAIL_ENCRYPTION_KEY_BASE64}
    email-hmac-key: ${EMAIL_HMAC_KEY_BASE64}
    issuer: suishi
    audience: suishi-web
    access-seconds: 900
    refresh-seconds: 604800
    cookie-secure: true
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    login-limit: 30
    register-limit: 10
  redis-prefix: ${REDIS_PREFIX:suishi:}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    admin-username: ${ADMIN_USERNAME:demo_admin}
    admin-password: ${ADMIN_PASSWORD:}
    demo-enabled: ${APP_DEMO_ENABLED:false}
    demo-password: ${DEMO_PASSWORD:}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
